<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="scaffold mark">
  <title>scaffold mark</title>
  <!-- Monochrome register mark for Moodle theming (currentColor). Four
       registration corners frame a bold plus — the add-block slot
       reduced to its corners. Hierarchy from stroke weight only. -->
