name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated release tag to retry"
        required: true
        type: "string"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.source_ci.outputs.ci_run_id }}
      commit: ${{ steps.identity.outputs.commit }}
      release_title: ${{ steps.identity.outputs.release_title }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate tag, commit, and coordinated versions
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag $RELEASE_TAG must be annotated." >&2
            exit 1
          fi

          release_commit="$(git rev-parse "$tag_ref^{}")"
          tag_object="$(git rev-parse "$tag_ref")"
          if [[ "$(git rev-parse HEAD)" != "$release_commit" ]]; then
            echo "The checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release commit $release_commit is not on main." >&2
            exit 1
          fi

          node scripts/prepare-release-candidate.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" \
            --commit "$release_commit" \
            --notes-output "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Require successful source CI
        id: source_ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail

          workflow_runs="$RUNNER_TEMP/required-ci-runs.json"
          gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_COMMIT" \
            -f status="success" \
            -f per_page=100 \
            > "$workflow_runs"
          run_ids="$RUNNER_TEMP/required-ci-run-ids"
          if ! jq -er \
            --arg commit "$RELEASE_COMMIT" \
            '[
              .workflow_runs[] |
                select(
                  .head_sha == $commit and
                  (.event == "push" or .event == "workflow_dispatch") and
                  .status == "completed" and
                  .conclusion == "success" and
                  .path == ".github/workflows/ci.yml"
                )
            ] |
              if length > 0 then
                .[].id
              else
                error("no successful Required CI run")
              end' \
            "$workflow_runs" \
            > "$run_ids"; then
            echo "Required CI has not passed for $RELEASE_COMMIT." >&2
            exit 1
          fi

          ci_run_id=""
          while IFS= read -r run_id; do
            artifacts="$RUNNER_TEMP/required-ci-$run_id-artifacts.json"
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              -f per_page=100 \
              > "$artifacts"
            candidate_count="$(
              jq -er \
                '[
                  .artifacts[] |
                    select(
                      .name == "moodle-plugin-candidate" and
                      .expired == false
                    )
                ] | length' \
                "$artifacts"
            )"
            if [[ "$candidate_count" == "1" ]]; then
              ci_run_id="$run_id"
              break
            fi
          done < "$run_ids"

          if [[ -z "$ci_run_id" ]]; then
            echo "Required CI for $RELEASE_COMMIT does not have one unexpired Moodle candidate." >&2
            exit 1
          fi
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

  package:
    name: Assemble exact release packages
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}

      - name: Download tested Moodle candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moodle-plugin-candidate
          path: ${{ runner.temp }}/moodle-plugin-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.ci_run_id }}

      - name: Stage tested Moodle candidate
        env:
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          TESTED_MOODLE_CANDIDATE: ${{ runner.temp }}/moodle-plugin-candidate
        run: |
          set -euo pipefail

          if [[ ! "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Required CI run ID must be a positive integer." >&2
            exit 1
          fi

          archives="$(
            find "$TESTED_MOODLE_CANDIDATE" -type f -name 'mod_scaffold-*.zip' -print
          )"
          archive_count="$(printf '%s\n' "$archives" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$archive_count" != "1" ]]; then
            echo "Expected exactly one tested Moodle candidate, found $archive_count." >&2
            exit 1
          fi

          archive="$archives"
          expected_name="mod_scaffold-$RELEASE_VERSION.zip"
          if [[ "$(basename "$archive")" != "$expected_name" ]]; then
            echo "Tested Moodle candidate must be named $expected_name." >&2
            exit 1
          fi

          checksum="$archive.sha256"
          if [[ ! -f "$checksum" ]]; then
            echo "Tested Moodle candidate is missing its checksum sidecar." >&2
            exit 1
          fi
          (
            cd "$(dirname "$archive")"
            sha256sum --check "$(basename "$checksum")"
          )

          release_directory="dist/release/$RELEASE_VERSION"
          mkdir -p "$release_directory"
          cp "$archive" "$release_directory/$expected_name"
          cp "$checksum" "$release_directory/$expected_name.sha256"

          candidate_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          jq -n \
            --arg commit "$RELEASE_COMMIT" \
            --arg filename "$expected_name" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" \
            --arg sha256 "$candidate_sha256" \
            --arg workflow ".github/workflows/ci.yml" \
            --argjson run_id "$CI_RUN_ID" \
            '{
              schema: 1,
              source_commit: $commit,
              required_ci: {
                workflow: $workflow,
                run_id: $run_id,
                run_url: $run_url
              },
              moodle_candidate: {
                filename: $filename,
                sha256: $sha256
              }
            }' \
            > "$release_directory/release-evidence.json"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24.18.0"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.10"

      - name: Install workspace dependencies
        run: vp install

      - name: Build workspace dependencies
        run: vp run verify:build

      - name: Package XBlock
        run: vp run @scaffold/adapter-xblock#package

      - name: Assemble candidate evidence
        env:
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail

          release_directory="dist/release/$RELEASE_VERSION"
          expected_files=(
            "mod_scaffold-$RELEASE_VERSION.zip"
            "scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "scaffold_xblock-$RELEASE_VERSION.tar.gz"
          )
          for filename in "${expected_files[@]}"; do
            test -f "$release_directory/$filename"
            test -f "$release_directory/$filename.sha256"
          done

          (
            cd "$release_directory"
            cat ./*.sha256 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          handoff_directory="dist/release-candidate-handoff"
          mkdir -p "$handoff_directory"
          for filename in "${expected_files[@]}"; do
            cp "$release_directory/$filename" "$handoff_directory/$filename"
          done
          cp "$release_directory/SHA256SUMS" "$handoff_directory/SHA256SUMS"
          cp "$release_directory/release-evidence.json" "$handoff_directory/release-evidence.json"

          node scripts/prepare-release-candidate.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --notes-output "$handoff_directory/release-notes.md" \
            --github-output "$RUNNER_TEMP/release-output"

      - name: Upload private candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.gate.outputs.version }}
          path: dist/release-candidate-handoff
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest exact release packages
    needs: [gate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download private candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.gate.outputs.version }}
          path: candidate

      - name: Verify candidate handoff
        run: cd candidate && sha256sum --check SHA256SUMS

      - name: Generate build provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: candidate/SHA256SUMS

      - name: Stage provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail

          test -f "$PROVENANCE_BUNDLE"
          cp \
            "$PROVENANCE_BUNDLE" \
            "$RUNNER_TEMP/scaffold-$RELEASE_VERSION-provenance.jsonl"

      - name: Upload private provenance handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/scaffold-${{ needs.gate.outputs.version }}-provenance.jsonl
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create draft GitHub prerelease
    needs: [gate, package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download private candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.gate.outputs.version }}
          path: candidate

      - name: Download private provenance handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance-${{ needs.gate.outputs.version }}
          path: provenance

      - name: Create or safely complete the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.gate.outputs.release_title }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail

          release_directory="candidate"
          notes_path="candidate/release-notes.md"
          assets=(
            "$release_directory/mod_scaffold-$RELEASE_VERSION.zip"
            "$release_directory/scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "$release_directory/scaffold_xblock-$RELEASE_VERSION.tar.gz"
            "$release_directory/SHA256SUMS"
            "$release_directory/release-evidence.json"
            "provenance/scaffold-$RELEASE_VERSION-provenance.jsonl"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          test -f "$notes_path"

          tag_ref_json="$RUNNER_TEMP/tag-ref.json"
          tag_object_json="$RUNNER_TEMP/tag-object.json"
          gh api \
            "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
            > "$tag_ref_json"
          if ! jq -e \
            --arg ref "refs/tags/$RELEASE_TAG" \
            --arg tag_object "$EXPECTED_TAG_OBJECT" \
            '.ref == $ref and .object.type == "tag" and .object.sha == $tag_object' \
            "$tag_ref_json" \
            > /dev/null; then
            echo "Remote tag $RELEASE_TAG no longer matches the verified tag object." >&2
            exit 1
          fi
          gh api \
            "repos/$GH_REPO/git/tags/$EXPECTED_TAG_OBJECT" \
            > "$tag_object_json"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$EXPECTED_RELEASE_COMMIT" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$tag_object_json" \
            > /dev/null; then
            echo "Remote tag $RELEASE_TAG no longer points at the verified release commit." >&2
            exit 1
          fi

          existing_release="$RUNNER_TEMP/existing-release.json"
          release_status="$(
            curl \
              --silent \
              --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              --output "$existing_release" \
              --write-out '%{http_code}' \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$GH_REPO/releases/tags/$RELEASE_TAG"
          )"
          if [[ "$release_status" == "200" ]]; then
            if [[ "$(jq -r '.draft' "$existing_release")" != "true" ]]; then
              echo "Refusing to alter the existing published release $RELEASE_TAG." >&2
              exit 1
            fi

            comparison_directory="$(mktemp -d)"
            if ! jq -e '.assets | type == "array"' "$existing_release" > /dev/null; then
              echo "Existing draft returned malformed asset metadata." >&2
              exit 1
            fi
            existing_asset_names="$RUNNER_TEMP/existing-asset-names"
            jq -r '.assets[].name' "$existing_release" > "$existing_asset_names"
            existing_assets=()
            while IFS= read -r existing_name; do
              existing_assets+=("$existing_name")
            done < "$existing_asset_names"
            for existing_name in "${existing_assets[@]}"; do
              expected_path=""
              for asset in "${assets[@]}"; do
                if [[ "$(basename "$asset")" == "$existing_name" ]]; then
                  expected_path="$asset"
                  break
                fi
              done
              if [[ -z "$expected_path" ]]; then
                echo "Draft contains unexpected asset $existing_name." >&2
                exit 1
              fi

              gh release download \
                "$RELEASE_TAG" \
                --pattern "$existing_name" \
                --dir "$comparison_directory"
              if ! cmp -s "$expected_path" "$comparison_directory/$existing_name"; then
                echo "Draft asset $existing_name differs from the verified candidate." >&2
                exit 1
              fi
            done

            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              if ! printf '%s\n' "${existing_assets[@]}" | grep -Fqx "$asset_name"; then
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done

            gh release edit "$RELEASE_TAG" --draft --prerelease --title "$RELEASE_TITLE"
          elif [[ "$release_status" == "404" ]]; then
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "$RELEASE_TITLE" \
              --notes-file "$notes_path"
          else
            echo "GitHub returned HTTP $release_status while checking $RELEASE_TAG." >&2
            exit 1
          fi
