name: Publish XBlock to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish approved XBlock distributions
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/scaffold-xblock/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve approved release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/release.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$release_json"

          if [[ "$(jq -r '.draft' "$release_json")" != "false" ]]; then
            echo "Refusing to publish from draft release $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' "$release_json")" != "true" ]]; then
            echo "Refusing to publish a non-prerelease for $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' "$release_json")" != "$RELEASE_TAG" ]]; then
            echo "Release metadata does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$(jq -r '.published_at // empty' "$release_json")" == "" ]]; then
            echo "Release $RELEASE_TAG has not been published." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          if [[ "$(jq -r '.name' "$release_json")" != "Scaffold $version" ]]; then
            echo "Release title does not match Scaffold $version." >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          jq -er '.body | strings' "$release_json" > "$notes"
          if grep -Fq "smoke test: pending" "$notes"; then
            echo "Release notes still contain pending smoke tests." >&2
            exit 1
          fi
          if ! grep -Eq '^- Moodle smoke test: passed on .+$' "$notes"; then
            echo "Moodle smoke test evidence is missing." >&2
            exit 1
          fi
          if ! grep -Eq '^- Open edX smoke test: passed on .+$' "$notes"; then
            echo "Open edX smoke test evidence is missing." >&2
            exit 1
          fi
          recorded_commit_count="$(
            sed -nE 's/^- Source commit: `([0-9a-f]{40})`$/\1/p' "$notes" |
              wc -l |
              tr -d ' '
          )"
          release_commit="$(
            sed -nE 's/^- Source commit: `([0-9a-f]{40})`$/\1/p' "$notes"
          )"
          if [[ "$recorded_commit_count" != "1" ]]; then
            echo "Release notes must identify exactly one source commit." >&2
            exit 1
          fi

          tag_ref_json="$RUNNER_TEMP/tag-ref.json"
          tag_object_json="$RUNNER_TEMP/tag-object.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > "$tag_ref_json"
          if ! jq -e \
            --arg ref "refs/tags/$RELEASE_TAG" \
            '.ref == $ref and .object.type == "tag" and
              (.object.sha | test("^[0-9a-f]{40}$"))' \
            "$tag_ref_json" \
            > /dev/null; then
            echo "Release tag $RELEASE_TAG must remain annotated." >&2
            exit 1
          fi
          tag_object="$(jq -er '.object.sha' "$tag_ref_json")"
          gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            > "$tag_object_json"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$release_commit" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit' \
            "$tag_object_json" \
            > /dev/null; then
            echo "Release tag does not match the approved source commit." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "release_json=$release_json" >> "$GITHUB_OUTPUT"

      - name: Require exact release assets
        env:
          RELEASE_JSON: ${{ steps.release.outputs.release_json }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          expected_assets=(
            "mod_scaffold-$RELEASE_VERSION.zip"
            "scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "scaffold_xblock-$RELEASE_VERSION.tar.gz"
            "SHA256SUMS"
            "release-evidence.json"
            "scaffold-$RELEASE_VERSION-provenance.jsonl"
          )
          actual_asset_names="$RUNNER_TEMP/actual-asset-names"
          jq -er \
            '.assets | if type == "array" and length > 0
              then .[].name
              else error("release assets must be a non-empty array")
            end' \
            "$RELEASE_JSON" \
            > "$actual_asset_names"
          actual_assets=()
          while IFS= read -r actual_name; do
            actual_assets+=("$actual_name")
          done < "$actual_asset_names"

          for expected_name in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${actual_assets[@]}" | grep -Fqx "$expected_name"; then
              echo "Release is missing expected asset $expected_name." >&2
              exit 1
            fi
          done
          for actual_name in "${actual_assets[@]}"; do
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fqx "$actual_name"; then
              echo "Refusing to publish with unexpected release asset $actual_name." >&2
              exit 1
            fi
          done

      - name: Download approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/candidate"
          gh release download \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/candidate"

      - name: Verify coordinated checksums
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail

          expected_files=(
            "mod_scaffold-$RELEASE_VERSION.zip"
            "scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "scaffold_xblock-$RELEASE_VERSION.tar.gz"
          )
          if [[ "$(wc -l < SHA256SUMS | tr -d ' ')" != "3" ]]; then
            echo "SHA256SUMS must contain exactly three entries." >&2
            exit 1
          fi
          if grep -Evq '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' SHA256SUMS; then
            echo "SHA256SUMS contains an invalid entry." >&2
            exit 1
          fi
          awk '{ print $2 }' SHA256SUMS > checksum-files
          checksum_files=()
          while IFS= read -r checksum_name; do
            checksum_files+=("$checksum_name")
          done < checksum-files
          rm checksum-files
          for expected_name in "${expected_files[@]}"; do
            if ! printf '%s\n' "${checksum_files[@]}" | grep -Fqx "$expected_name"; then
              echo "SHA256SUMS is missing $expected_name." >&2
              exit 1
            fi
          done
          for checksum_name in "${checksum_files[@]}"; do
            if ! printf '%s\n' "${expected_files[@]}" | grep -Fqx "$checksum_name"; then
              echo "SHA256SUMS contains unexpected file $checksum_name." >&2
              exit 1
            fi
          done

          sha256sum --check SHA256SUMS

      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/candidate"
          bundle="$candidate/scaffold-$RELEASE_VERSION-provenance.jsonl"
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          packages=(
            "mod_scaffold-$RELEASE_VERSION.zip"
            "scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "scaffold_xblock-$RELEASE_VERSION.tar.gz"
          )
          for package in "${packages[@]}"; do
            gh attestation verify \
              "$candidate/$package" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$certificate_identity" \
              --source-digest "$RELEASE_COMMIT" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          done

      - name: Stage missing PyPI distributions
        id: stage
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/candidate"
          publish_directory="$GITHUB_WORKSPACE/.pypi-dist"
          if [[ -e "$publish_directory" ]]; then
            echo "PyPI staging directory already exists." >&2
            exit 1
          fi
          mkdir -p "$publish_directory"
          distributions=(
            "scaffold_xblock-$RELEASE_VERSION-py3-none-any.whl"
            "scaffold_xblock-$RELEASE_VERSION.tar.gz"
          )

          pypi_json="$RUNNER_TEMP/pypi-release.json"
          pypi_status="$(
            curl \
              --silent \
              --show-error \
              --output "$pypi_json" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/scaffold-xblock/$RELEASE_VERSION/json"
          )"
          if [[ "$pypi_status" != "200" && "$pypi_status" != "404" ]]; then
            echo "PyPI returned HTTP $pypi_status while checking $RELEASE_VERSION." >&2
            exit 1
          fi
          if [[ "$pypi_status" == "404" ]]; then
            printf '{"urls":[]}\n' > "$pypi_json"
          fi

          if ! jq -e \
            '.urls | type == "array" and all(.[];
              (.filename | type == "string") and
              (.digests.sha256 | type == "string") and
              (.yanked | type == "boolean")
            )' \
            "$pypi_json" \
            > /dev/null; then
            echo "PyPI returned malformed release metadata." >&2
            exit 1
          fi

          unexpected_distribution="$(
            jq -er \
              --arg wheel "${distributions[0]}" \
              --arg sdist "${distributions[1]}" \
              '[.urls[].filename | select(. != $wheel and . != $sdist)] |
                if length == 0 then "" else .[0] end' \
              "$pypi_json"
          )"
          if [[ -n "$unexpected_distribution" ]]; then
            echo "PyPI contains unexpected PyPI distribution $unexpected_distribution." >&2
            exit 1
          fi
          yanked_distribution="$(
            jq -er \
              '[.urls[] | select(.yanked == true) | .filename] |
                if length == 0 then "" else .[0] end' \
              "$pypi_json"
          )"
          if [[ -n "$yanked_distribution" ]]; then
            echo "PyPI distribution $yanked_distribution is yanked." >&2
            exit 1
          fi
          duplicate_distribution="$(
            jq -er \
              '[.urls[].filename] | group_by(.) |
                map(select(length > 1) | .[0]) |
                if length == 0 then "" else .[0] end' \
              "$pypi_json"
          )"
          if [[ -n "$duplicate_distribution" ]]; then
            echo "PyPI returned duplicate metadata for $duplicate_distribution." >&2
            exit 1
          fi

          upload_count=0
          for distribution in "${distributions[@]}"; do
            expected_digest="$(sha256sum "$candidate/$distribution" | awk '{ print $1 }')"
            existing_digest=""
            if [[ "$pypi_status" == "200" ]]; then
              existing_digest="$(
                jq -er \
                  --arg filename "$distribution" \
                  '[.urls[] | select(.filename == $filename) | .digests.sha256] |
                    if length == 0 then "" else .[0] end' \
                  "$pypi_json"
              )"
            fi

            if [[ -n "$existing_digest" ]]; then
              if [[ "$existing_digest" != "$expected_digest" ]]; then
                echo "The existing PyPI digest for $distribution does not match the approved release." >&2
                exit 1
              fi
              echo "$distribution already exists on PyPI with the approved digest."
              continue
            fi

            cp "$candidate/$distribution" "$publish_directory/$distribution"
            upload_count=$((upload_count + 1))
          done

          echo "upload_count=$upload_count" >> "$GITHUB_OUTPUT"

      - name: Publish verified XBlock distributions
        if: steps.stage.outputs.upload_count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .pypi-dist/
