name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PULL_REQUEST_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          docs=false
          while IFS= read -r -d '' path; do
            case "$path" in
              CHANGELOG.md|THIRD_PARTY_NOTICES.md|adapters/moodle/scaffold/*.md|adapters/xblock/CHANGES.md|adapters/xblock/README.md|adapters/xblock/scaffold_xblock/*.md)
                code=true
                docs=true
                ;;
              *.md|documentation/*|.github/readme/*|.github/ISSUE_TEMPLATE/*)
                docs=true
                ;;
              LICENSE)
                code=true
                ;;
              *)
                code=true
                ;;
            esac
          done < <(git diff --name-only -z "$base_sha" "$HEAD_SHA")

          if [[ "$code" == false && "$docs" == false ]]; then
            code=true
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation
    needs: classify
    if: ${{ needs.classify.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Check documentation
        run: vp run verify:docs

  build:
    name: Build workspace
    needs: classify
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Doctor
        run: vp run doctor

      - name: Build
        run: vp run verify:build

      - name: Package Moodle plugin candidate
        run: python3 adapters/moodle/scripts/package.py

      - name: Archive package outputs
        run: tar -czf package-builds.tgz packages/contracts/dist packages/core/dist packages/grading/dist

      - name: Upload package outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-builds
          path: package-builds.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Moodle plugin candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moodle-plugin-candidate
          path: |
            dist/release/*/mod_scaffold-*.zip
            dist/release/*/mod_scaffold-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  static:
    name: Format, lint, and types
    needs: [classify, build]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Download package outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-builds
          path: .tmp/package-builds

      - name: Restore package outputs
        run: tar -xzf .tmp/package-builds/package-builds.tgz

      - name: Static checks
        run: vp run --ignore-depends-on verify:static

  architecture:
    name: Architecture
    needs: classify
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Check dependency boundaries
        run: vp run verify:architecture

  artifacts:
    name: Generated artifacts
    needs: classify
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Check generated artifacts
        run: vp run verify:artifacts

  tooling:
    name: Repository tooling
    needs: classify
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Test repository tooling
        run: vp run verify:tooling

  core-unit:
    name: Core unit tests (${{ matrix.shard }})
    needs: [classify, build]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Download package outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-builds
          path: .tmp/package-builds

      - name: Restore package outputs
        run: tar -xzf .tmp/package-builds/package-builds.tgz

      - name: Test Core unit shard
        run: vp exec --filter @scaffold/core -- vp test run --project unit --shard "${{ matrix.shard }}"

  core-browser:
    name: Core browser tests
    needs: [classify, build]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Download package outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-builds
          path: .tmp/package-builds

      - name: Restore package outputs
        run: tar -xzf .tmp/package-builds/package-builds.tgz

      - name: Install Chromium
        run: vp exec --filter @scaffold/core -- playwright install --with-deps chromium

      - name: Test Core in Chromium
        run: vp exec --filter @scaffold/core -- vp test run --project browser

  workspace-tests:
    name: Workspace tests
    needs: [classify, build]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install
        run: vp install

      - name: Download package outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-builds
          path: .tmp/package-builds

      - name: Restore package outputs
        run: tar -xzf .tmp/package-builds/package-builds.tgz

      - name: Test non-Core workspaces
        run: vp run --filter '!@scaffold/core' test

  xblock-runtime:
    name: XBlock runtime (Python ${{ matrix.python }}, XBlock ${{ matrix.xblock }}, ${{ matrix.host }})
    needs: [classify]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            xblock: "5.2.0"
            host: Open edX Ulmo
          - python: "3.12"
            xblock: "6.3.1"
            host: XBlock 6 boundary
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install XBlock runtime boundary
        run: python -m pip install "XBlock==${{ matrix.xblock }}"

      - name: Test Scaffold XBlock runtime
        run: >-
          PYTHONPATH=adapters/xblock python -m unittest
          adapters.xblock.tests.test_assessment_contracts
          adapters.xblock.tests.test_grade_delivery
          adapters.xblock.tests.test_grade_projection
          adapters.xblock.tests.test_grading_conformance
          adapters.xblock.tests.test_learner_activity
          adapters.xblock.tests.test_learner_activity_contracts
          adapters.xblock.tests.test_scaffold_projection

      - name: Install and load Scaffold entry point
        run: |
          python -m pip install --no-deps ./adapters/xblock
          python - <<'PY'
          from importlib.metadata import entry_points

          entry_point = next(
              candidate
              for candidate in entry_points(group="xblock.v1")
              if candidate.name == "scaffold"
          )
          loaded = entry_point.load()
          assert loaded.__module__ == "scaffold_xblock.scaffold"
          assert loaded.__name__ == "ScaffoldXBlock"
          print(f"Loaded {entry_point.name} = {entry_point.value}")
          PY

  moodle-phpunit:
    name: Moodle PHPUnit (${{ matrix.moodle }}, PHP ${{ matrix.php }}, ${{ matrix.database }})
    needs: [classify, build]
    if: ${{ needs.classify.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_405_STABLE
            php: "8.1"
            database: mysqli
            database-image: mysql:8.0
            database-port: 3306
            database-health-command: mysqladmin ping -h localhost -uroot -pmoodle
            database-user: root
            php-extension: mysqli
          - moodle: MOODLE_502_STABLE
            php: "8.3"
            database: pgsql
            database-image: postgres:16
            database-port: 5432
            database-health-command: pg_isready -U moodle -d postgres
            database-user: moodle
            php-extension: pgsql
    services:
      database:
        image: ${{ matrix.database-image }}
        env:
          MYSQL_ROOT_PASSWORD: moodle
          POSTGRES_DB: postgres
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
        ports:
          - "${{ matrix.database-port }}:${{ matrix.database-port }}"
        options: >-
          --health-cmd="${{ matrix.database-health-command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Download Moodle plugin candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moodle-plugin-candidate
          path: ${{ runner.temp }}/moodle-plugin-candidate-download

      - name: Restore Moodle plugin candidate
        env:
          CANDIDATE_DOWNLOAD: ${{ runner.temp }}/moodle-plugin-candidate-download
          CANDIDATE_ROOT: ${{ runner.temp }}/moodle-plugin-candidate
        shell: bash
        run: |
          mapfile -t archives < <(find "$CANDIDATE_DOWNLOAD" -type f -name 'mod_scaffold-*.zip' -print)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Moodle plugin candidate, found ${#archives[@]}." >&2
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"
          if [[ ! -f "$checksum" ]]; then
            echo "Missing checksum sidecar for $archive." >&2
            exit 1
          fi

          (
            cd "$(dirname "$archive")"
            sha256sum --check "$(basename "$checksum")"
          )

          mkdir -p "$CANDIDATE_ROOT"
          unzip -q "$archive" -d "$CANDIDATE_ROOT"
          pluginpath="$CANDIDATE_ROOT/scaffold"
          if [[ ! -f "$pluginpath/version.php" ]]; then
            echo "Extracted Moodle candidate is missing scaffold/version.php." >&2
            exit 1
          fi

          digest="$(sha256sum "$archive" | awk '{print $1}')"
          echo "Moodle candidate SHA-256: $digest"
          echo "MOODLE_PLUGIN_CANDIDATE_NAME=$(basename "$archive")" >> "$GITHUB_ENV"
          echo "MOODLE_PLUGIN_PATH=$pluginpath" >> "$GITHUB_ENV"
          echo "MOODLE_PLUGIN_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Prepare Moodle workspace
        run: mkdir -p "${{ runner.temp }}/moodle-plugin-ci-work"

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, soap, zip, gd, ${{ matrix.php-extension }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle
        env:
          DB: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_NAME: moodle
          DB_PASS: moodle
          DB_PORT: ${{ matrix.database-port }}
          DB_USER: ${{ matrix.database-user }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: >-
          moodle-plugin-ci install
          --plugin "$MOODLE_PLUGIN_PATH"
          --db-host=127.0.0.1
          --db-port=${{ matrix.database-port }}
          --no-plugin-node

      - name: Run Moodle component suite
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: >-
          moodle-plugin-ci phpunit
          --testsuite mod_scaffold_testsuite
          --fail-on-warning
          --fail-on-risky

      - name: Confirm Moodle developer debugging
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: |
          php -r '
          define("CLI_SCRIPT", true);
          require "moodle/config.php";
          if ($CFG->debug !== DEBUG_DEVELOPER || empty($CFG->debugdisplay)) {
              fwrite(STDERR, "Moodle developer debugging is not enabled.\n");
              exit(1);
          }
          '

      - name: Run Moodle Behat developer-debug smoke
        id: behat_smoke
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: >-
          moodle-plugin-ci behat
          --profile chrome
          --tags=@mod_scaffold_smoke
          --start-servers
          --auto-rerun=0
          --dump

      - name: Record Moodle Behat smoke evidence
        if: ${{ !cancelled() && steps.behat_smoke.outcome == 'success' }}
        env:
          DATABASE: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
          PHP_VERSION: ${{ matrix.php }}
        shell: bash
        run: |
          {
            printf '### Moodle developer-debug Behat smoke\n\n'
            printf '%s\n' "- Candidate: $MOODLE_PLUGIN_CANDIDATE_NAME"
            printf '%s\n' "- SHA-256: $MOODLE_PLUGIN_SHA256"
            printf '%s\n' "- Moodle: $MOODLE_BRANCH"
            printf '%s\n' "- PHP: $PHP_VERSION"
            printf '%s\n' "- Database: $DATABASE"
            printf '%s\n' '- Scenario: @mod_scaffold_smoke'
            printf '%s\n' '- Result: passed with DEBUG_DEVELOPER and debug display enabled'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Moodle Behat faildump
          path: ${{ runner.temp }}/moodle-plugin-ci-work/moodledata/behat_dump
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Moodle PHP lint
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci phplint

      - name: Run Moodle code checker
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Run Moodle PHPDoc checker
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Run Moodle plugin validation
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci validate

      - name: Run Moodle upgrade savepoint validation
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci savepoints

      - name: Run Moodle Grunt checks
        if: ${{ !cancelled() && matrix.moodle == 'MOODLE_502_STABLE' && matrix.database == 'pgsql' }}
        working-directory: ${{ runner.temp }}/moodle-plugin-ci-work
        run: moodle-plugin-ci grunt --max-lint-warnings 0

  status:
    name: Required CI
    if: ${{ !cancelled() }}
    needs:
      - classify
      - docs
      - build
      - static
      - architecture
      - artifacts
      - tooling
      - core-unit
      - core-browser
      - workspace-tests
      - xblock-runtime
      - moodle-phpunit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail when a required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Confirm required jobs
        run: echo "All required CI jobs passed or were intentionally skipped."
